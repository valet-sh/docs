<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>valet.sh docs - page moved</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; max-width: 40rem; margin: 4rem auto; padding: 0 1rem; color: #222; }
  a { color: #0a66c2; }
  @media (prefers-color-scheme: dark) { body { color: #ddd; background: #1a1a1a; } a { color: #6cb2ff; } }
</style>
<script>
  (function () {
    var path = window.location.pathname;
    // Already inside a versioned build (2.x/, 3.x/, latest/) - don't redirect again, this is a genuine 404.
    if (/^\/(latest|[0-9]+(\.[0-9]+)*\.x)(\/|$)/.test(path)) {
      return;
    }
    var target = "/latest" + path + window.location.search + window.location.hash;
    window.location.replace(target);
  })();
</script>
</head>
<body>
  <p>This page has moved. Redirecting to the current documentation&hellip;</p>
  <p>If you are not redirected automatically, <a href="/latest/">click here</a>.</p>
</body>
</html>
